# Reusable CI for repositories built by the autonomous software factory (python). A repository calls it from its
# own .github/workflows/ci.yml:
#   jobs:
#     ci:
#       uses: Trysac/factory-ci/.github/workflows/python.yml@v1
#       secrets: inherit
# The jobs only re-run the repository's own gates (its scripts/check), so one release here updates the CI of every
# caller without a pull request per repository. Every job is skipped while the calling repository is private.
name: CI (python)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    if: ${{ !github.event.repository.private }}
    name: gates (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # gitleaks runs in its own job below with the official action.
      FABRICA_ALLOW_MISSING_GITLEAKS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run python scripts/check.py

  # CI-only tier: the full suite, including the tests tagged conformance (external tools or downloads).
  # The gates job above runs exactly the local tier, so its coverage is the one the factory measured.
  conformance:
    if: ${{ !github.event.repository.private }}
    name: conformance (full suite)
    runs-on: ubuntu-latest
    env:
      FABRICA_ALLOW_MISSING_GITLEAKS: "1"
      FABRICA_CI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      # Security scanners for the CI tier (FABRICA_CI=1 fails when one is missing). Semgrep CE runs only the
      # factory's rules in .semgrep/; OSV-Scanner is built from its pinned module (checked by the Go checksum DB).
      - name: security scanners (Semgrep CE, OSV-Scanner)
        shell: bash
        run: |
          pipx install semgrep==1.180.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Optional, project-provided tool installation for the conformance tier. Only CI runs it, never
      # the factory or the local gates. Downloads must be verified against a pinned SHA-256.
      - name: conformance tools (ci/conformance-setup.sh, optional)
        shell: bash
        run: |
          if [ -f ci/conformance-setup.sh ]; then bash ci/conformance-setup.sh; else echo "no ci/conformance-setup.sh"; fi
      - run: uv run python scripts/check.py

  secrets:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repository belongs to a GitHub organization (free for personal accounts).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

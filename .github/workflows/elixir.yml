# Reusable CI for repositories built by the autonomous software factory (elixir). A repository calls it from its own
# .github/workflows/ci.yml:
#   jobs:
#     ci:
#       uses: Trysac/factory-ci/.github/workflows/elixir.yml@v1
#       secrets: inherit
# The jobs only re-run the repository's own gates (its scripts/check.exs), so one release here updates the CI of
# every caller without a pull request per repository. Every job is skipped while the calling repository is private.
# Elixir 1.20 on Erlang/OTP 29 through setup-beam (with Hex and rebar3); the tools (Credo, Dialyxir, StreamData,
# mix_audit) are the repository's own dev/test dependencies, pinned by its mix.lock and fetched with
# `mix deps.get --check-locked`, which fails instead of rewriting a lock that does not match mix.exs.
name: CI (elixir)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    if: ${{ !github.event.repository.private }}
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # gitleaks runs in its own job below with the official action. The dependency audit fetches the Hex API and
      # the Elixir security advisories and runs in both jobs; OSV-Scanner is installed only in the conformance job.
      FABRICA_ALLOW_MISSING_GITLEAKS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - run: mix deps.get --check-locked
      - run: elixir scripts/check.exs

  # CI-only tier: the full suite, including the tests tagged :conformance (external tools or downloads), and the
  # scanners. The gates job above runs exactly the local tier, so its coverage is the one the factory measured.
  conformance:
    if: ${{ !github.event.repository.private }}
    name: conformance (full suite)
    runs-on: ubuntu-latest
    env:
      FABRICA_ALLOW_MISSING_GITLEAKS: "1"
      FABRICA_CI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - run: mix deps.get --check-locked
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      # Security scanners for the CI tier (FABRICA_CI=1 fails when one is missing). Semgrep CE runs only the
      # factory's rules in .semgrep/; OSV-Scanner is built from its pinned module (checked by the Go checksum DB).
      - name: security scanners (Semgrep CE, OSV-Scanner)
        shell: bash
        run: |
          pipx install semgrep==1.180.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Optional, project-provided tool installation for the conformance tier. Only CI runs it, never
      # the factory or the local gates. Downloads must be verified against a pinned SHA-256.
      - name: conformance tools (ci/conformance-setup.sh, optional)
        shell: bash
        run: |
          if [ -f ci/conformance-setup.sh ]; then bash ci/conformance-setup.sh; else echo "no ci/conformance-setup.sh"; fi
      - run: elixir scripts/check.exs

  secrets:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repository belongs to a GitHub organization (free for personal accounts).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

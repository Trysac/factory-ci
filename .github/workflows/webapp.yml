# Reusable CI for repositories built by the autonomous software factory (webapp). A repository calls it from its
# own .github/workflows/ci.yml:
#   jobs:
#     ci:
#       uses: Trysac/factory-ci/.github/workflows/webapp.yml@v1
#       secrets: inherit
# The jobs only re-run the repository's own gates (its scripts/check), so one release here updates the CI of every
# caller without a pull request per repository. Every job is skipped while the calling repository is private.
name: CI (webapp)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    if: ${{ !github.event.repository.private }}
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24] # oldest supported LTS in CI and the factory's local version
    env:
      FABRICA_ALLOW_MISSING_GITLEAKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check

  gitleaks:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repository belongs to a GitHub organization (free for personal accounts).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
